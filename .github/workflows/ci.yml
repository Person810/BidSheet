name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # Native modules and the Electron binary aren't needed for
      # typechecking or the pure-function test suite
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # Production dependencies only — the app ships these. Dev-tree
      # advisories (electron-builder etc.) don't reach users and would
      # make the gate cry wolf.
      - name: Audit production dependencies
        run: npm audit --omit=dev
