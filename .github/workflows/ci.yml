name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # --ignore-scripts keeps dependency postinstalls (incl. the Electron
      # binary download) from running arbitrary code during install.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      # The one native module the tests need: the sync/import suite runs
      # against a real SQLite database, and --ignore-scripts skipped the
      # binding build. Rebuild runs only this package's install script
      # (prebuilt binary download, or a local gyp compile).
      - name: Build better-sqlite3 binding
        run: npm rebuild better-sqlite3

      - name: Typecheck
        run: npm run typecheck

      # Ratchet, not a clean-tree gate. ESLint was adopted onto ~25k lines of
      # existing code, so .lint-baseline.json grandfathers the current per-rule
      # counts and this step fails only when a count RISES. Gating on zero would
      # have meant one enormous refactor PR before anything else could merge;
      # gating on nothing lets the count grow quietly. `npm run lint:baseline`
      # re-locks the floor after you fix things — it only moves down.
      - name: Lint (ratchet)
        run: npm run lint:ratchet

      # Makes section E ("backend built, UI never calls it") mechanical. Also
      # catches the one wiring bug tsc structurally cannot: window.d.ts is
      # hand-written, so a method declared there but never exposed by preload
      # type-checks fine and is undefined at runtime. Allowlisted like the lint
      # baseline — gates NEW breakage without demanding the backlog be cleared.
      - name: Check IPC wiring
        run: npm run check:ipc

      - name: Test
        run: npm test

      # Production dependencies only — the app ships these. Dev-tree
      # advisories (electron-builder etc.) don't reach users and would
      # make the gate cry wolf.
      #
      # Gated at high because the moderate tier has no reachable fix here:
      # react-router's two moderates cover 6.0.0–7.17.0, and 7.12.0+ carries
      # a *high* of its own, so the first clean version is react-router 8 —
      # which needs React >= 19.2.7 and Node >= 22. Neither moderate can fire
      # in this app anyway: one is SSR-hydration only (this is a HashRouter
      # SPA in Electron, no server) and the other is an open redirect through
      # a user-controlled `to`, while every route here is a hardcoded literal
      # or comes from the trade-module registry. Revisit if react-router
      # backports a fix, or when React 19 lands.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
