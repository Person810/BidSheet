<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://*.paddle.com https://*.profitwell.com; style-src 'self' 'unsafe-inline' https://*.paddle.com; img-src 'self' data: https://*.paddle.com https://*.profitwell.com; font-src 'self'; connect-src 'self' https://*.paddle.com https://*.profitwell.com; frame-src https://*.paddle.com; manifest-src 'self'; form-action 'self'; base-uri 'none'">
  <title>BidSheet Cloud · Checkout</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/icon.png" type="image/png">
  <link rel="stylesheet" href="/assets/site.css">
  <style>
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      gap: 24px;
    }
    .card-checkout {
      position: relative;
      z-index: 1;
      background: var(--navy);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 40px 36px;
      max-width: 460px;
    }
    .card-checkout h1 {
      font-family: var(--serif);
      font-size: 1.7rem;
      margin-bottom: 12px;
    }
    .card-checkout h1 span { color: var(--gold); }
    .card-checkout p { color: var(--text-muted); line-height: 1.6; font-size: 0.95rem; }
    .card-checkout p + p { margin-top: 10px; }
    .card-checkout a { color: var(--gold); text-decoration: none; }
    .card-checkout a:hover, .card-checkout a:focus-visible { text-decoration: underline; }
    .checkout-links {
      position: relative;
      z-index: 1;
      font-size: 13px;
      color: var(--text-muted);
      display: flex;
      flex-wrap: wrap;
      gap: 8px 20px;
      justify-content: center;
    }
    .checkout-links a { color: var(--text-muted); text-decoration: none; }
    .checkout-links a:hover, .checkout-links a:focus-visible { color: var(--text); text-decoration: underline; }
  </style>
</head>
<body>
  <div class="bg-grid" aria-hidden="true"></div>

  <main class="card-checkout">
    <h1>BidSheet <span>Cloud</span></h1>
    <p id="status" role="status">Loading secure checkout…</p>
    <p>Payment is handled by Paddle, our merchant of record. After paying, you can
       close this tab. The BidSheet app picks up your subscription automatically.</p>
  </main>

  <nav class="checkout-links" aria-label="Legal">
    <a href="/pricing/">Pricing</a>
    <a href="/legal/terms/">Terms</a>
    <a href="/legal/privacy/">Privacy</a>
    <a href="/legal/refunds/">Refunds</a>
    <a href="/contact/">Contact</a>
    <a href="/faq/">FAQ</a>
  </nav>

  <script src="https://cdn.paddle.com/paddle/v2/paddle.js"></script>
  <script src="/assets/js/checkout.js"></script>
</body>
</html>
