<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BidSheet Cloud · Checkout</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/icon.png" type="image/png">
  <link rel="stylesheet" href="/assets/site.css">
  <style>
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      gap: 24px;
    }
    .card-checkout {
      position: relative;
      z-index: 1;
      background: var(--navy);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 40px 36px;
      max-width: 460px;
    }
    .card-checkout h1 {
      font-family: var(--serif);
      font-size: 1.7rem;
      margin-bottom: 12px;
    }
    .card-checkout h1 span { color: var(--gold); }
    .card-checkout p { color: var(--text-muted); line-height: 1.6; font-size: 0.95rem; }
    .card-checkout p + p { margin-top: 10px; }
    .card-checkout a { color: var(--gold); text-decoration: none; }
    .card-checkout a:hover, .card-checkout a:focus-visible { text-decoration: underline; }
    .checkout-links {
      position: relative;
      z-index: 1;
      font-size: 13px;
      color: var(--text-muted);
      display: flex;
      flex-wrap: wrap;
      gap: 8px 20px;
      justify-content: center;
    }
    .checkout-links a { color: var(--text-muted); text-decoration: none; }
    .checkout-links a:hover, .checkout-links a:focus-visible { color: var(--text); text-decoration: underline; }
  </style>
</head>
<body>
  <div class="bg-grid" aria-hidden="true"></div>

  <main class="card-checkout">
    <h1>BidSheet <span>Cloud</span></h1>
    <p id="status" role="status">Loading secure checkout…</p>
    <p>Payment is handled by Paddle, our merchant of record. After paying, you can
       close this tab. The BidSheet app picks up your subscription automatically.</p>
  </main>

  <nav class="checkout-links" aria-label="Legal">
    <a href="/pricing/">Pricing</a>
    <a href="/legal/terms/">Terms</a>
    <a href="/legal/privacy/">Privacy</a>
    <a href="/legal/refunds/">Refunds</a>
    <a href="/contact/">Contact</a>
    <a href="/faq/">FAQ</a>
  </nav>

  <script src="https://cdn.paddle.com/paddle/v2/paddle.js"></script>
  <script>
    // Client-side token (public by design): Paddle dashboard → Developer
    // tools → Authentication → Client-side tokens. test_… = sandbox,
    // live_… = production; the environment is derived from the prefix, so
    // going live is a one-line swap.
    var PADDLE_CLIENT_TOKEN = 'live_844c2d8eb518de02e2357e1b145';

    var status = document.getElementById('status');
    var txn = new URLSearchParams(location.search).get('_ptxn');

    if (PADDLE_CLIENT_TOKEN.indexOf('__') === 0) {
      status.textContent = 'Checkout is not configured yet.';
    } else if (!txn) {
      status.innerHTML = 'Nothing to check out. Start from the BidSheet app: ' +
        'Settings → Cloud Sync → Subscribe. <a href="/">Back to bidsheet.co</a>';
    } else {
      if (PADDLE_CLIENT_TOKEN.indexOf('test_') === 0) {
        Paddle.Environment.set('sandbox');
      }
      // Paddle.js spots the _ptxn parameter and opens the overlay checkout
      // for that transaction on its own once initialized.
      Paddle.Initialize({
        token: PADDLE_CLIENT_TOKEN,
        eventCallback: function (ev) {
          if (ev.name === 'checkout.completed') {
            status.textContent = 'Payment complete. You can close this tab and return to BidSheet.';
          }
        }
      });
      status.textContent = 'Opening secure checkout…';
    }
  </script>
</body>
</html>
