<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BidSheet Cloud — Checkout</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="../icon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=DM+Serif+Display&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --navy-deep: #0a1628;
      --navy: #122240;
      --gold: #d4a843;
      --text: #e2e8f0;
      --text-muted: #8a9bb8;
      --border: rgba(255, 255, 255, 0.06);
    }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--navy-deep);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
    .card {
      background: var(--navy);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 40px 36px;
      max-width: 460px;
    }
    h1 {
      font-family: 'DM Serif Display', serif;
      font-size: 1.7rem;
      margin-bottom: 12px;
    }
    h1 span { color: var(--gold); }
    p { color: var(--text-muted); line-height: 1.6; font-size: 0.95rem; }
    p + p { margin-top: 10px; }
    a { color: var(--gold); text-decoration: none; }
  </style>
</head>
<body>
  <div class="card">
    <h1>BidSheet <span>Cloud</span></h1>
    <p id="status">Loading secure checkout…</p>
    <p>Payment is handled by Paddle, our merchant of record. After paying, you can
       close this tab — the BidSheet app picks up your subscription automatically.</p>
  </div>

  <script src="https://cdn.paddle.com/paddle/v2/paddle.js"></script>
  <script>
    // Client-side token (public by design): Paddle dashboard → Developer
    // tools → Authentication → Client-side tokens. test_… = sandbox,
    // live_… = production; the environment is derived from the prefix, so
    // going live is a one-line swap.
    var PADDLE_CLIENT_TOKEN = 'test_177c96a1c8d1992fb9a4ebef5b0';

    var status = document.getElementById('status');
    var txn = new URLSearchParams(location.search).get('_ptxn');

    if (PADDLE_CLIENT_TOKEN.indexOf('__') === 0) {
      status.textContent = 'Checkout is not configured yet.';
    } else if (!txn) {
      status.innerHTML = 'Nothing to check out. Start from the BidSheet app: ' +
        'Settings → Cloud Sync → Subscribe. <a href="/">Back to bidsheet.co</a>';
    } else {
      if (PADDLE_CLIENT_TOKEN.indexOf('test_') === 0) {
        Paddle.Environment.set('sandbox');
      }
      // Paddle.js spots the _ptxn parameter and opens the overlay checkout
      // for that transaction on its own once initialized.
      Paddle.Initialize({
        token: PADDLE_CLIENT_TOKEN,
        eventCallback: function (ev) {
          if (ev.name === 'checkout.completed') {
            status.textContent = 'Payment complete — you can close this tab and return to BidSheet.';
          }
        }
      });
      status.textContent = 'Opening secure checkout…';
    }
  </script>
</body>
</html>
